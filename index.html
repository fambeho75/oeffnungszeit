<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <script>
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("oeffnungszeit-theme");
        if (saved === "light" || saved === "dark") theme = saved;
      } catch (err) {}
      document.documentElement.setAttribute("data-theme", theme);
      var color = theme === "light" ? "#f7f7f8" : "#0a0a0a";
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute("content", color);
      var schemeMeta = document.querySelector('meta[name="color-scheme"]');
      if (schemeMeta) schemeMeta.setAttribute("content", theme);
    })();
  </script>
  <meta name="description" content="See if your Skövde shops are open.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Öffnungszeit">
  <title>Öffnungszeit</title>
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="icon" href="favicon-32.png?v=3" sizes="32x32" type="image/png">
  <link rel="icon" href="icon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <noscript>
    <p class="noscript">Öffnungszeit needs JavaScript to show open and closed.</p>
  </noscript>
  <div id="app"></div>
  <script src="theme.js?v=1"></script>
  <script src="hours.js?v=2"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
